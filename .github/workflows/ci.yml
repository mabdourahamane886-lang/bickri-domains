name: Bickri Domains CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-placeholder
      BICKRI_HOSTING_DOMAIN: bickridomains.com
      NEXT_PUBLIC_BICKRI_HOSTING_DOMAIN: bickridomains.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
